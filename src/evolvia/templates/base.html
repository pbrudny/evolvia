<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Evolvia{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="/">Evolvia <span>play, create, evolve</span></a>
    <nav>
      {% if me %}
        <span class="who">@{{ me }}</span>
        <form method="post" action="/logout"><button class="link">Sign out</button></form>
      {% else %}
        <a class="button" href="/login?next={{ request.url.path }}">Sign in with GitHub</a>
      {% endif %}
    </nav>
  </header>
  <main>{% block main %}{% endblock %}</main>
  <footer>A class project for Event Driven Programming at <a href="https://akademiata.pl">akademiata.pl</a> · <a href="https://github.com/pbrudny/evolvia">How it works</a></footer>
  {% block scripts %}{% endblock %}
</body>
</html>
